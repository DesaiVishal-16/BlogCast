# Lingo.dev Configuration
# Documentation: https://lingo.dev/docs

version: 1.0

# Source language (original content language)
source:
  language: en
  path: ./locales/en

# Target languages for AI translation
targets:
  - language: hi
    path: ./locales/hi
    name: Hindi
  - language: es
    path: ./locales/es
    name: Spanish
  - language: fr
    path: ./locales/fr
    name: French
  - language: de
    path: ./locales/de
    name: German
  - language: it
    path: ./locales/it
    name: Italian
  - language: pt
    path: ./locales/pt
    name: Portuguese
  - language: ru
    path: ./locales/ru
    name: Russian
  - language: ja
    path: ./locales/ja
    name: Japanese
  - language: ko
    path: ./locales/ko
    name: Korean
  - language: zh
    path: ./locales/zh
    name: Chinese
  - language: ar
    path: ./locales/ar
    name: Arabic
  - language: nl
    path: ./locales/nl
    name: Dutch
  - language: pl
    path: ./locales/pl
    name: Polish
  - language: tr
    path: ./locales/tr
    name: Turkish
  - language: vi
    path: ./locales/vi
    name: Vietnamese

# Translation settings
settings:
  format: json
  fallback: en
  fast: false # Set to true for faster but potentially lower quality translations

  # Batch settings
  batch:
    enabled: true
    size: 50
    delay: 100

# Files to translate
files:
  # Backend API messages
  - pattern: 'backend/src/i18n/*.json'
    type: json

  # Frontend translations
  - pattern: 'frontend/locales/*.json'
    type: json

  # Content files
  - pattern: 'content/**/*.md'
    type: markdown

  # API documentation
  - pattern: 'docs/**/*.md'
    type: markdown

  # Configuration files
  - pattern: 'locales/**/*.json'
    type: json

  - pattern: 'locales/**/*.yaml'
    type: yaml

  - pattern: 'locales/**/*.yml'
    type: yaml

# Translation rules
rules:
  # Skip certain keys
  ignore:
    - '*.url'
    - '*.email'
    - '*.api_key'
    - '*.token'
    - '*.id'
    - '*.uuid'
    - '*.timestamp'

  # Preserve formatting
  preserve:
    - '*.markdown'
    - '*.html'

  # Glossary for consistent translations
  glossary:
    en:
      'blog': 'blog'
      'translation': 'translation'
      'audio': 'audio'
      'language': 'language'
      'content': 'content'

# CI/CD settings
ci:
  enabled: true
  auto_commit: true
  create_pull_request: true
  pull_request_title: '🌍 AI Translation Update'
  pull_request_body: |
    This pull request contains AI-generated translations powered by Lingo.dev.

    ## Changes
    - Updated translations for all target languages
    - Synchronized content with source language (English)

    ## Languages Updated
    {{languages}}

    ## How to Review
    1. Check the translation quality for your language
    2. Verify technical terms are correctly translated
    3. Approve if everything looks good

    _This PR was automatically generated by Lingo.dev CI/CD_
